spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------------
# SERVER SETTINGS
# -------------------------------------------------------------------------
server.port=${PORT:8080}

# -------------------------------------------------------------------------
# FILE UPLOAD
# -------------------------------------------------------------------------
file.upload-dir=uploads/songs
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# -------------------------------------------------------------------------
# SECURITY (JWT & ADMIN)
# -------------------------------------------------------------------------
# Replace these with real values or set them in Render Environment Variables
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

cashfree.app.id=${CASHFREE_APP_ID}
cashfree.secret.key=${CASHFREE_SECRET_KEY}
cashfree.api.version=2023-08-01
cashfree.environment=sandbox

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
