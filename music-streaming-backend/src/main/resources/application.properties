spring.application.name=music-streaming-backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/music_streaming_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=manager
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=YourSecretKeyForJWTMustBeAtLeast32CharactersLongForHS256Algorithm
jwt.expiration=86400000

# File Upload Configuration
file.upload-dir=uploads/songs
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Server Configuration
server.port=8080

# Logging
logging.level.com.backend=INFO
logging.file.name=logs/music-streaming-backend.log

# Cashfree Payment Gateway Configuration
cashfree.app.id=${CASHFREE_APP_ID}
cashfree.secret.key=${CASHFREE_SECRET_KEY}
cashfree.api.version=2023-08-01
cashfree.environment=sandbox

# Default Admin User Configuration
app.admin.email=arya@scotify.com
app.admin.password=Arya@123
app.admin.name=System Admin
