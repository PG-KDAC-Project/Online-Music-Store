spring.application.name=music-streaming-backend

# ============================
# Database Configuration (Railway)
# ============================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ============================
# JWT Configuration
# ============================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ============================
# File Upload Configuration
# ============================
file.upload-dir=uploads/songs
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ============================
# Server Configuration (Railway)
# ============================
server.port=${PORT:8080}

# ============================
# Logging
# ============================
logging.level.com.backend=INFO
logging.file.name=logs/music-streaming-backend.log

# ============================
# Cashfree Payment Gateway
# ============================
cashfree.app.id=${CASHFREE_APP_ID}
cashfree.secret.key=${CASHFREE_SECRET_KEY}
cashfree.api.version=2023-08-01
cashfree.environment=sandbox

# ============================
# Default Admin User
# ============================
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME}